<meta charset="utf-8">
<title>finale — filmstrip &amp; luminance</title>
<style>
  body { font: 12px/1.5 ui-monospace, Menlo, monospace; background:#0b0d18; color:#cfcce0;
         margin:0; padding:16px 20px; }
  h1 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#ffb347; margin:0 0 4px; }
  p.sub { color:#74718c; margin:0 0 12px; }
  canvas { display:block; border:1px solid #20233a; margin-bottom:10px; }
  #verdict { white-space:pre; font-size:12.5px; }
  iframe { position:fixed; left:-10000px; top:0; border:0; }
  .k { color:#ffb347; }
</style>
<h1>finale — filmstrip &amp; luminance</h1>
<p class="sub" id="sub">booting…</p>
<canvas id="sheet"></canvas>
<canvas id="chart"></canvas>
<div id="verdict"></div>

<script>
// PROFESSIONAL CAPTURE, three problems solved at once:
//  1. the Browser pane parks rAF, so wall-clock playback cannot be observed --
//     the clock is pumped deterministically instead, which is exact, not approximate
//  2. one screenshot per frame would be ~50 tool calls -- every frame is composited
//     into a single contact sheet
//  3. WebGL discards its drawing buffer, so the FLIGHT (which is entirely GL) was
//     invisible to capture -- ?capture=1 turns on preserveDrawingBuffer
// Plus the metric that actually matches the complaint: ink coverage per frame.
// "Three seconds of blackness" is a measurable quantity, not an impression.

const Q = new URLSearchParams(location.search);
// ?from=&to= zooms the strip onto one beat. The canvas composite is GROUND TRUTH
// for t < 0.66 because the DOM resume is still at opacity 0 there -- everything
// you see in that window really is the particles.
const T0 = parseFloat(Q.get("from") || "0"), T1 = parseFloat(Q.get("to") || "1");
const COLS = 8, ROWS = 5, N = COLS * ROWS;
const TW = 165, TH = 104;
const VOID_LUM = 12;                          // #0a0b14
const sheet = document.getElementById("sheet");
sheet.width = COLS * TW; sheet.height = ROWS * TH;
const sctx = sheet.getContext("2d");
const chart = document.getElementById("chart");
chart.width = COLS * TW; chart.height = 150;
const cctx = chart.getContext("2d");

function frame(w, h) {
  return new Promise((res, rej) => {
    const f = document.createElement("iframe");
    f.width = w; f.height = h;
    f.src = "../index.html?capture=1&t=" + Date.now();
    f.onload = () => {
      let n = 0;
      (function wait() {
        const win = f.contentWindow;
        try { win.dispatchEvent(new win.Event("resize")); } catch (e) {}
        if (win.__lab && win.__GL3) return res({ f, win });
        if (++n > 200) return rej(new Error("page never became testable"));
        setTimeout(wait, 25);
      })();
    };
    document.body.appendChild(f);
  });
}

// composite what the VIEWER sees: void, then the 2D stage, then the GL layer at
// its live CSS opacity. The DOM resume is not a canvas, so it is reported
// numerically and drawn as a bar rather than faked into the picture.
const scratch = document.createElement("canvas");
const kctx = scratch.getContext("2d", { willReadFrequently: true });

function sample(win, col, row) {
  const stage = win.document.getElementById("stage");
  const gl = win.document.getElementById("gl3");
  const glOp = parseFloat(gl.style.opacity || 0);
  const outro = parseFloat(win.document.getElementById("outro").style.opacity || 0);

  scratch.width = TW; scratch.height = TH;
  kctx.fillStyle = "#0a0b14"; kctx.fillRect(0, 0, TW, TH);
  kctx.drawImage(stage, 0, 0, stage.width, stage.height, 0, 0, TW, TH);
  if (glOp > 0.001) {
    kctx.globalAlpha = glOp;
    kctx.drawImage(gl, 0, 0, gl.width, gl.height, 0, 0, TW, TH);
    kctx.globalAlpha = 1;
  }
  // ink coverage: fraction of pixels meaningfully brighter than the void
  const d = kctx.getImageData(0, 0, TW, TH).data;
  let lit = 0, sum = 0, px = 0;
  for (let i = 0; i < d.length; i += 4) {
    const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    sum += l; px++;
    if (l > VOID_LUM + 10) lit++;
  }
  sctx.drawImage(scratch, col * TW, row * TH);
  return { cov: lit / px, lum: sum / px, glOp, outro };
}

(async () => {
  const { f, win } = await frame(1280, 800);
  const L = win.__lab;
  const S = [];
  for (let i = 0; i < N; i++) {
    const t = T0 + (T1 - T0) * (i / (N - 1));
    L.finBeat(t, 0.849);
    const s = sample(win, i % COLS, Math.floor(i / COLS));
    s.t = +t.toFixed(3);
    s.ms = Math.round(t * (L.fin().fwd || 5200));
    S.push(s);
    // label each tile with its clock time
    sctx.fillStyle = "rgba(0,0,0,.55)";
    sctx.fillRect((i % COLS) * TW, Math.floor(i / COLS) * TH, 40, 13);
    sctx.fillStyle = "#ffb347"; sctx.font = "10px ui-monospace, monospace";
    sctx.fillText(s.t.toFixed(2), (i % COLS) * TW + 3, Math.floor(i / COLS) * TH + 10);
  }
  L.finFree(); f.remove();

  // chart: coverage per frame, with the DOM resume's opacity overlaid
  cctx.fillStyle = "#0b0d18"; cctx.fillRect(0, 0, chart.width, chart.height);
  const maxCov = Math.max(0.001, ...S.map(s => s.cov));
  S.forEach((s, i) => {
    const x = i * (chart.width / N), w = chart.width / N - 1;
    const h = (s.cov / maxCov) * 110;
    cctx.fillStyle = s.cov < 0.005 ? "#ff3d81" : "#3ee6c4";
    cctx.fillRect(x, 130 - h, w, h);
    if (s.outro > 0.01) { cctx.fillStyle = "rgba(255,255,255,.5)"; cctx.fillRect(x, 130 - s.outro * 110, w, 2); }
  });
  cctx.fillStyle = "#74718c"; cctx.font = "10px ui-monospace, monospace";
  cctx.fillText("ink coverage per frame — PINK = under 0.5% (effectively black); white line = resume opacity", 6, 145);

  // the verdict: longest run of effectively-black frames
  let best = { len: 0 }, run = null;
  S.forEach((s, i) => {
    if (s.cov < 0.005) { run = run || { from: s.t, i0: i }; run.to = s.t; run.len = i - run.i0 + 1; if (run.len > best.len) best = Object.assign({}, run); }
    else run = null;
  });
  const ms = L.fin().fwd || 5200;
  const deadMs = best.len ? Math.round((best.to - best.from) * ms) : 0;
  const lines = [
    `frames: ${N}   clock: ${ms}ms   peak coverage: ${(maxCov * 100).toFixed(2)}%`,
    best.len ? `LONGEST BLACK RUN: t=${best.from.toFixed(2)} → ${best.to.toFixed(2)}  ≈ ${deadMs}ms  (${best.len} frames under 0.5% ink)`
             : `no black run: every frame carries ink`,
    `resume first visible at t=${(S.find(s => s.outro > 0.02) || {}).t}`,
    `coverage at key beats — ` + [0.1, 0.25, 0.4, 0.55, 0.7, 0.85, 1.0]
      .map(k => { const s = S.reduce((a, b) => Math.abs(b.t - k) < Math.abs(a.t - k) ? b : a);
                  return `${k}:${(s.cov * 100).toFixed(1)}%`; }).join("  ")
  ];
  document.getElementById("verdict").textContent = lines.join("\n");
  document.getElementById("sub").textContent =
    "each tile = one clock position; pumped deterministically, GL readback via ?capture=1";
  window.__FILM = { samples: S, blackRun: best, deadMs };
  window.__DONE = true;
})().catch(e => {
  document.getElementById("verdict").textContent = "FAILED: " + e.message;
  window.__DONE = true;
});
</script>
