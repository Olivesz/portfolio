<meta charset="utf-8">
<title>portfolio — regression suite</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; background:#0b0d18; color:#cfcce0;
         margin:0; padding:20px 24px; }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:#ffb347; margin:0 0 14px; }
  .r { padding:3px 0; border-bottom:1px solid #1b1e30; display:flex; gap:10px; }
  .r b { min-width:52px; }
  .pass b { color:#3ee6c4; } .fail b { color:#ff3d81; }
  .fail { background:rgba(255,61,129,.07); }
  .d { color:#74718c; margin-left:auto; text-align:right; }
  #sum { margin-top:14px; font-size:14px; }
  iframe { position:fixed; left:-10000px; top:0; border:0; }
</style>
<h1>portfolio regression suite</h1>
<div id="out"></div>
<div id="sum">running…</div>

<script>
// Drives the real index.html inside a same-origin iframe via its __lab handle.
// Sizing the IFRAME is what gives us 375 / 768 / 1280 without touching the
// browser window -- innerWidth inside the frame is the frame's own width.
const R = [];
const out = document.getElementById("out");
function ok(name, cond, detail) {
  const text = detail === undefined ? "" : String(detail);
  R.push({ name, pass: !!cond, detail: text });
  const row = document.createElement("div");
  row.className = "r " + (cond ? "pass" : "fail");
  const b = document.createElement("b"); b.textContent = cond ? "PASS" : "FAIL";
  const n = document.createElement("span"); n.textContent = name;
  const d = document.createElement("span"); d.className = "d"; d.textContent = text;
  row.append(b, n, d);
  out.appendChild(row);
}
const near = (a, b, tol) => Math.abs(a - b) <= tol;

function frame(w, h) {
  return new Promise((res, rej) => {
    const f = document.createElement("iframe");
    f.width = w; f.height = h;
    f.src = "../index.html?test=" + Date.now();
    f.onload = () => {
      const win = f.contentWindow;
      let n = 0;
      (function wait() {
        // the GL build is gated on a sane #sheet layout; a resize event drives
        // its retry synchronously, which rAF cannot be trusted to do in a
        // background/hidden frame
        try { win.dispatchEvent(new win.Event("resize")); } catch (e) {}
        if (win.__lab && win.__GL3) return res({ f, win });
        if (++n > 200) return rej(new Error("index.html never became testable (no __lab/__GL3)"));
        setTimeout(wait, 25);
      })();
    };
    document.body.appendChild(f);
  });
}

// The GLYPH box, not the element box. #outro h2 is a full-width block with
// CENTRED text, so its bounding box slides under the left-aligned nav while the
// letters sit well clear -- a naive rect test reports overlap at 1280px where
// there visibly is none. Range over the text contents gives the real ink.
// ...and a Range still returns LINE BOXES, which include half-leading above the
// cap height and below the baseline. At 1280 that reads as a 7.5px "overlap"
// between the nav and a headline whose ink actually clears it by ~5px. So shrink
// by the half-leading, exactly the correction the resume raster makes, to get
// something close to the real ink.
function glyphRect(win, el) {
  const r = win.document.createRange();
  r.selectNodeContents(el);
  const b = r.getBoundingClientRect();
  r.detach && r.detach();
  const cs = win.getComputedStyle(el);
  const fs = parseFloat(cs.fontSize) || 0;
  let lh = parseFloat(cs.lineHeight);
  if (!lh || isNaN(lh)) lh = fs * 1.2;
  const pad = Math.max(0, (lh - fs) / 2);
  return { left: b.left, right: b.right, top: b.top + pad, bottom: b.bottom - pad };
}
function overlaps(a, b) {
  return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
}

// content box of the real #sheet, which the particle page must land on
function sheetBox(win) {
  const el = win.document.getElementById("sheet");
  const r = el.getBoundingClientRect(), cs = win.getComputedStyle(el);
  const pl = parseFloat(cs.paddingLeft), pr = parseFloat(cs.paddingRight);
  return { left: r.left + pl, width: r.width - pl - pr, top: r.top };
}

async function suite() {
  // ---------- A. builds, and the page is made of the right document ----------
  for (const [w, h, tol] of [[1280, 800, 6], [768, 900, 6], [375, 812, 8]]) {
    const { f, win } = await frame(w, h);
    const L = win.__lab;
    ok(`[${w}] GL page builds`, win.__GL3 && win.__GL3.count > 3000, (win.__GL3 || {}).count + " particles");

    // 0.99, not 1.0: at exactly 1 the finale hands the frame back to the outro
    // (by design), so draw() stops running and the camera goes unpositioned --
    // inkRect would read +/-Infinity. The pose is fully landed from t~0.763, so
    // 0.99 measures the same geometry the reader actually receives.
    L.finBeat(0.99, 0.90);
    const ink = win.__GL3.inkRect(), box = sheetBox(win);
    ok(`[${w}] resume lands on the DOM sheet (x)`,
       near(ink.left, box.left, tol), `gl ${ink.left.toFixed(1)} vs sheet ${box.left.toFixed(1)}`);
    ok(`[${w}] resume lands on the DOM sheet (width)`,
       near(ink.right - ink.left, box.width, tol),
       `gl ${(ink.right - ink.left).toFixed(1)} vs sheet ${box.width.toFixed(1)}`);
    L.finFree();

    // The unzip must sweep the age band that is actually ON SCREEN. A loose
    // "0.5 < uReveal < 1" assertion is useless here -- it passes on the old
    // hardcoded 0.84, which is the very bug this guards (0.84 sits BELOW the
    // visible minimum, so a third of the beat swept cells nobody can see).
    // So: compute the real visible minimum from the same trail the shader uses.
    const st = L.jump(0.849), cam = st.cam;
    const T = win.__TRAIL, cnt = T.length / 3;
    let newest = -1, ni = 0;
    for (let i = 0; i < cnt; i++) if (T[i * 3 + 2] > newest) { newest = T[i * 3 + 2]; ni = i; }
    const C = Math.round(st.ant.x - T[ni * 3]);            // grid centre, derived not assumed
    let visMin = 1;
    for (let i = 0; i < cnt; i++) {
      const sx = w / 2 + (T[i * 3] + C - cam.x) * cam.s;
      const sy = h / 2 + (T[i * 3 + 1] + C - cam.y) * cam.s;
      if (sx > -40 && sx < w + 40 && sy > -40 && sy < h + 40 && T[i * 3 + 2] < visMin) visMin = T[i * 3 + 2];
    }
    L.finBeat(0.0, 0.849);
    const r0 = win.__GL3.MAT.uniforms.uReveal.value;
    L.finBeat(0.30, 0.849);
    const r1 = win.__GL3.MAT.uniforms.uReveal.value;
    L.finFree();
    ok(`[${w}] unzip starts at the visible age band, not below it`,
       Math.abs(r0 - visMin) < 0.02, `uReveal@t0 ${r0.toFixed(3)} vs visible min ${visMin.toFixed(3)}`);
    ok(`[${w}] unzip finishes past the newest cell`, r1 >= 1.0, "uReveal@t.30 " + r1.toFixed(3));
    f.remove();
  }

  // ---------- B. the finale is a clock, not a scrubber ----------
  {
    const { f, win } = await frame(1280, 800);
    const L = win.__lab;

    L.jump(0.83); L.finBeat(0, 0.849); L.finFree(); L.finDir(1);
    let n = 0, lockedFrames = 0;
    while (L.fin().t < 1 && n < 900) { L.tickTo(0.849, 1, 16.7); if (L.fin().lock) lockedFrames++; n++; }
    ok("clock completes with scroll parked", L.fin().t === 1, Math.round(n * 16.7) + "ms");
    ok("page is held for the whole transformation", lockedFrames > n * 0.95,
       lockedFrames + "/" + n + " frames locked");
    ok("lock releases on arrival", L.fin().lock === false);
    ok("landed past the finale band", L.fin().scrollP > L.fin().p1, "p=" + L.fin().scrollP);

    // scroll-up mid-flight reverses instead of scrubbing
    L.jump(0.83); L.finBeat(0, 0.849); L.finFree(); L.finDir(1); L.tickTo(0.849, 40, 16.7);
    const prevented = !win.dispatchEvent(new win.WheelEvent("wheel", { deltaY: -120, cancelable: true }));
    ok("wheel is swallowed while locked", prevented);
    ok("scroll-up flips direction", L.fin().dir === -1);
    let r = 0; while (L.fin().t > 0 && r < 900) { L.tickTo(0.849, 1, 16.7); r++; }
    ok("reverse runs to completion", L.fin().t === 0, Math.round(r * 16.7) + "ms");
    ok("lock releases at the journey end too", L.fin().lock === false);

    // The TOUCH path, which is the only one that exists on a phone. The wheel
    // assertions above prove nothing about iOS, where no wheel event is ever
    // fired -- if touchmove were registered passive, preventDefault would be a
    // no-op and the page would scroll straight through the climax.
    L.jump(0.83); L.finBeat(0, 0.849); L.finFree(); L.finDir(1); L.tickTo(0.849, 40, 16.7);
    let touchVerdict = null;
    try {
      const mk = (y) => new win.TouchEvent("touchmove", {
        cancelable: true, bubbles: true,
        touches: [new win.Touch({ identifier: 1, target: win.document.body, clientX: 100, clientY: y })]
      });
      win.dispatchEvent(new win.TouchEvent("touchstart", {
        cancelable: true, bubbles: true,
        touches: [new win.Touch({ identifier: 1, target: win.document.body, clientX: 100, clientY: 400 })]
      }));
      touchVerdict = !win.dispatchEvent(mk(340));      // finger up => scroll down
    } catch (e) { touchVerdict = "no TouchEvent ctor: " + e.name; }
    ok("touchmove is swallowed while locked (the phone path)",
       touchVerdict === true, touchVerdict === true ? "preventDefault honoured" : String(touchVerdict));

    // and the lock must never leak outside the finale
    L.jump(0.50); L.finFree();
    const preventedFree = !win.dispatchEvent(new win.WheelEvent("wheel", { deltaY: 120, cancelable: true }));
    ok("wheel is NOT swallowed outside the finale", preventedFree === false);
    ok("no stuck scroll lock", win.document.body.className.indexOf("fin-lock") < 0);

    // ---------- C. the outro gets its own frame back ----------
    L.jump(0.985);
    const cv = win.document.getElementById("stage");
    const g = cv.getContext("2d");
    const px = g.getImageData(0, 0, cv.width, cv.height).data;
    let distinct = 0; const seen = {};
    for (let i = 0; i < px.length; i += 4 * 997) {
      const k = (px[i] >> 3) + "," + (px[i + 1] >> 3) + "," + (px[i + 2] >> 3);
      if (!seen[k]) { seen[k] = 1; distinct++; }
    }
    ok("outro renders its own backdrop (not the finale's blank frame)",
       distinct > 1, distinct + " distinct colours sampled");

    // ---------- D. nothing throws anywhere on the timeline ----------
    const errs = [];
    for (let p = 0; p <= 1.0001; p += 0.01) { const x = L.tickTo(p, 10, 16.7); if (x.err) errs.push(x.err); }
    for (let p = 1.0; p >= 0; p -= 0.01) { const x = L.tickTo(p, 10, 16.7); if (x.err) errs.push(x.err); }
    ok("no exceptions sweeping the timeline both ways", errs.length === 0, errs[0] || "0 errors");
    f.remove();
  }

  // ---------- E. the fixed nav must never sit on the outro headline ----------
  // 812x375 is a landscape phone: the nav is a tidy single line, but #outro
  // exceeds max-height:94vh, pins to the viewport top and slides UNDER it.
  // 320 wide is the opposite failure -- a nav wrapped to three lines.
  for (const [w, h, label] of [[1280, 800, "desktop"], [375, 812, "portrait phone"],
                               [812, 375, "landscape phone"], [320, 640, "narrow phone"]]) {
    const { f, win } = await frame(w, h);
    win.__lab.jump(0.98);                      // deep in the outro
    const bar = win.document.getElementById("idbar");
    // the h2 itself, NOT the .o-head wrapper -- the half-leading correction has
    // to come from the headline's own font metrics, and a wrapper inherits the
    // body's tiny ones, which makes the correction a no-op
    const head = win.document.querySelector("#outro h2") ||
                 win.document.querySelector("#outro .o-head");
    if (bar && head) {
      const hit = overlaps(glyphRect(win, bar), glyphRect(win, head));
      ok(`[${w}x${h}] nav clear of the outro headline (${label})`, !hit,
         hit ? "GLYPHS OVERLAP" : "clear");
    } else {
      ok(`[${w}x${h}] nav/headline present (${label})`, false, "selector missed");
    }
    f.remove();
  }

  // ---------- F. the nav's width cap must follow the skip button ----------
  // It reserved a frozen 172px for #skip. Nothing tied that to the button, so
  // editing its label would silently re-wrap the mobile nav, with a symptom
  // (a third line over the chapter caption) that looks nothing like the cause.
  {
    const { f, win } = await frame(375, 812);
    win.__lab.jump(0.5);                                   // story range: #skip visible
    const bar = win.document.getElementById("idbar");
    const before = parseFloat(win.getComputedStyle(bar).maxWidth);
    win.document.getElementById("skip").textContent =
      "skip past the whole journey to the summary at the end →";
    win.dispatchEvent(new win.Event("resize"));
    const after = parseFloat(win.getComputedStyle(bar).maxWidth);
    ok("nav width cap tracks the skip button's label",
       after < before - 20, `max-width ${before.toFixed(0)} -> ${after.toFixed(0)}px`);
    // ...but it must squeeze, never vanish. Without a floor the reserve exceeds
    // 100vw and the cap goes negative, collapsing the nav entirely.
    ok("nav never collapses to nothing under a wide skip button",
       after >= 0.4 * 375, `${after.toFixed(0)}px of ${375}`);
    f.remove();
  }

  // ---------- F3. every morph anchor must actually supply its diagram ----------
  // `want` was 360 for the life of the page while the walk peaks at 357, so stride
  // was always 1 and every diagram was capped by supply rather than by design. It
  // was invisible because the only symptom is a slightly thinner picture. A console
  // warning cannot cover this -- boot() runs before any listener can attach -- so
  // the supply data is exposed and asserted here instead.
  {
    const { f, win } = await frame(1280, 800);
    const sup = win.__lab.supply();
    ok("every chapter's morph anchor is sampled", sup.length === 4, sup.length + " anchors");
    const starved = sup.filter(a => a.margin < 0);
    ok("no morph anchor is starved of particles", starved.length === 0,
       starved.length ? starved.map(a => a.step + ": " + a.pts + "/" + a.want).join(", ")
                      : "min margin +" + Math.min.apply(null, sup.map(a => a.margin)));
    f.remove();
  }

  // ---------- F4. every VISIBLE chapter number must count i..N ----------
  // After the cut from eight chapters to four, the bento tiles and aria-labels were
  // renumbered and the card kickers and the narrator line were not: the page said
  // "chapter viii" on a four-chapter site for a month. The check that "verified" it
  // grepped the source for a literal middle dot, and the kickers are written as the
  // &middot; entity, so the pattern could not see them. Read RENDERED text instead --
  // innerText has already decoded every entity, so the encoding cannot hide a numeral.
  {
    const { f, win } = await frame(1280, 800);
    const R = ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii"];
    // lower-cased: the kickers carry text-transform:uppercase, and innerText reports
  // the TRANSFORMED text, so "chapter ii" reads back as "CHAPTER II".
  const num = t => (((t || "").match(/chapter\s+([ivx]+)\b/i) || [])[1] || "").toLowerCase();
    const kick = [...win.document.querySelectorAll("section.card .kicker")].map(k => num(k.innerText));
    ok("card kickers count i..N", kick.join() === R.slice(0, kick.length).join(), kick.join(" "));
    const lead = win.document.getElementById("phaseLead"), seen = [];
    for (const p of [0.16, 0.38, 0.56, 0.75]) { win.__lab.jump(p); seen.push(num(lead.textContent)); }
    ok("the narrator counts i..N", seen.join() === R.slice(0, seen.length).join(), seen.join(" "));
    ok("kickers and narrator agree on the chapter count", kick.length === seen.length,
       kick.length + " kickers, " + seen.length + " narrator stops");
    f.remove();
  }

  // ---------- F2. the phone hero must say WHAT it is supposed to say ----------
  // A rule here hid spans 1-2 and kept span 3, while the comment above it claimed
  // the opposite -- "the phone keeps the identity half only". It survived for months
  // because every check asked whether the hero rendered SOMETHING, and it did: it
  // rendered the thesis line instead of the identity. When the thesis line was later
  // deleted, a phone got a blank hero. Asserting non-empty would not have caught
  // either state. Assert the CONTENT.
  {
    const { f, win } = await frame(375, 812);
    const p = win.document.querySelector("#hero p");
    const txt = (p.innerText || "").trim().toLowerCase();
    ok("the phone hero names the school", txt.includes("ut austin"), JSON.stringify(txt));
    ok("the phone hero names the programme", txt.includes("turing scholars"), JSON.stringify(txt));
    // and it must not quietly regrow a third item nobody signed off on
    ok("the phone hero carries exactly two items",
       p.querySelectorAll("span").length === 2,
       p.querySelectorAll("span").length + " spans");
    f.remove();
  }

  // ---------- G. the scroll map must survive a resize ----------
  // SCROLL_LEN was fixed at boot, so after a rotate the mapping and the document
  // that implements it disagreed -- p could not reach 1.0 and the finale became
  // unreachable by scrolling.
  {
    const { f, win } = await frame(1280, 800);
    const before = win.__lab.scrollMap();
    ok("scroll length matches the document at boot",
       Math.abs(before.len - before.maxScroll) <= 2, `len ${before.len} vs max ${before.maxScroll}`);

    // park the reader mid-story, then rotate under them
    win.scrollTo(0, 0.5 * before.len);
    f.height = 420; f.width = 812;
    await new Promise(r => setTimeout(r, 60));
    win.dispatchEvent(new win.Event("resize"));
    await new Promise(r => setTimeout(r, 60));

    const after = win.__lab.scrollMap();
    ok("scroll length is recomputed on resize",
       after.len !== before.len && Math.abs(after.len - after.maxScroll) <= 2,
       `len ${after.len} vs max ${after.maxScroll}`);
    ok("p is preserved across the resize", Math.abs(after.p - 0.5) < 0.02, "p=" + after.p);
    // Two-sided on purpose. A one-sided ">= 0.999" only catches a map LONGER
    // than the document (the end unreachable); a frozen map that is SHORTER
    // sails through it, and that is the direction a maximised window produces.
    ok("the scroll map still matches the document end to end",
       Math.abs(after.maxScroll / after.len - 1) <= 0.001,
       "ratio " + (after.maxScroll / after.len).toFixed(4));
    f.remove();
  }

  // ---------- H. the document must never arrive ahead of the animation ----------
  // Scrolling at a constant pace from the last chapter into the outro used to
  // land the reader in the outro scene while the particles were still flying:
  // shownP lags targetP, so the scene flipped at finT~0.64 and the resume faded
  // in over a half-finished transformation.
  {
    const { f, win } = await frame(1280, 800);
    const L = win.__lab;
    L.jump(0.78); L.finFree();
    const outroEl = win.document.getElementById("outro");
    let earliest = null, n = Math.round(6000 / 16.7);
    for (let i = 0; i < n; i++) {
      L.tickTo(0.78 + 0.22 * (i / n), 1, 16.7);
      const op = parseFloat(outroEl.style.opacity || 0);
      if (op > 0.02 && earliest === null) earliest = L.fin().t;
    }
    // The crossfade begins at FIN.t = 0.66 (retimed in V31 -- the document used
    // to wait until 0.78, i.e. 4.1s of a 5.2s clock, which read as dead air).
    // The guard is that it never starts EARLIER than that, which is what a
    // scroll-driven document would do.
    ok("the resume never appears ahead of the animation that makes it",
       earliest !== null && earliest >= 0.65,
       "document first visible at finT=" + (earliest === null ? "never" : earliest.toFixed(3)));
    ok("the animation still completes on that ride", L.fin().t === 1, "finT=" + L.fin().t);
    f.remove();
  }

  // ---------- I. the chapter card must never lie over the phase caption ----------
  // The card used to centre on top:50%, so its bottom edge was a function of how
  // long its copy ran. Four chapters overflowed into the caption at the bottom
  // left -- machinery by 39px, markets 18, impact 10, language 5 -- stacking two
  // pieces of text on the same pixels. The card is band-anchored now (top AND
  // bottom), so this holds at any copy length. Checked at the SHORT viewport
  // because that is where the band squeezes: 800px tall never reproduced it.
  for (const [vw, vh] of [[1280, 800], [1280, 720], [1440, 700]]) {
    const { f, win } = await frame(vw, vh);
    const L = win.__lab, doc = win.document;
    const phase = doc.getElementById("phase");
    let worstId = null, worst = -1e9, tallest = 0, lowestBox = 0, lowestId = null;
    // one measurement per chapter, at the p where that chapter's card is fully up
    for (const p of [0.14, 0.22, 0.30, 0.38, 0.46, 0.62, 0.70, 0.78]) {
      L.jump(p);
      // visibility is no longer the tell -- cards are permanently visible to AT now,
      // and only opacity distinguishes the live one. Pick the most opaque.
      const card = [...doc.querySelectorAll(".card")]
        .map(c => [c, parseFloat(win.getComputedStyle(c).opacity) || 0])
        .sort((a, b) => b[1] - a[1])
        .filter(([, o]) => o > 0.5)
        .map(([c]) => c)[0];
      if (!card) continue;
      // the LAST ink in the card, not the padded box: padding may legitimately
      // overhang, glyphs may not
      const kids = [...card.children];
      const inkBottom = Math.max(...kids.map(k => k.getBoundingClientRect().bottom));
      const gap = phase.getBoundingClientRect().top - inkBottom;
      if (-gap > worst) { worst = -gap; worstId = card.id; }
      const boxBottom = card.getBoundingClientRect().bottom;
      if (boxBottom > lowestBox) { lowestBox = boxBottom; lowestId = card.id; }
      const btn = card.querySelector(".branch");
      if (btn) tallest = Math.max(tallest, btn.getBoundingClientRect().height);
    }
    ok(`card ink clears the phase caption at ${vw}x${vh}`, worst < 0,
       `worst overlap ${Math.round(worst)}px (${worstId})`);
    // The structural half, and the one that actually catches a regression to
    // viewport-centring. Clearing the caption today is partly luck of the copy
    // length: trimming two chapters bought most of the margin, so the symptom
    // test above still passed on the un-banded build (measured). What the band
    // guarantees is that the BOX cannot reach the caption at any copy length --
    // reverted, these ran to 627px on a 700px window against a 600px line.
    ok(`the card box stays inside its reserved band at ${vw}x${vh}`, lowestBox <= vh - 100,
       `lowest card box ${Math.round(lowestBox)} vs reserved line ${vh - 100} (${lowestId})`);
    // A wrapped label is the tell: the pill is 33px on one line and ~48 on two.
    // "emergence act viii · private" is nowrap and so could not give up width;
    // without flex-shrink:0 the button paid for it and wrapped its own text.
    ok(`the branch button stays on one line at ${vw}x${vh}`, tallest > 0 && tallest < 40,
       `tallest branch pill ${Math.round(tallest)}px`);
    f.remove();
  }

  const bad = R.filter(x => !x.pass).length;
  const sum = document.getElementById("sum");
  sum.textContent = bad ? `${bad} FAILED of ${R.length}` : `all ${R.length} passed`;
  sum.style.color = bad ? "#ff3d81" : "#3ee6c4";
  window.__TESTS = { total: R.length, failed: bad, results: R };
  window.__DONE = true;
}

suite().catch(e => {
  ok("suite crashed", false, e.message);
  window.__TESTS = { total: R.length, failed: R.filter(x => !x.pass).length, results: R, crash: e.message };
  window.__DONE = true;
});
</script>
